; MOExperience 配置 (缺失=默认值, 改动后重启游戏) 不建议删除此文件
; 游戏内自动跟随系统语言，文本在 MOExperienceResources\<locale>.ini

; ==== ESC 菜单自定义页 ====
[EscMenu]
Enable=1		; ESC 菜单左侧自定义区总开关,0=不画

; ==== 战役\操作\聊天功能设置 ====
[MsgText]
Enable=1		; 本模块总开关 (0=关消息文本显示)
; ---- 战役框 (默认左上显示, 战役/聊天/系统, 可查看历史信息) ----
FontHeight=18	; 字高像素, 0=跟随游戏点阵字高
Bold=0			; 粗体 (0=常规, 1=粗体)
; 字体文件名 (如 msyh.ttc); 先找游戏当前文件夹, 再找系统字体文件夹,都找不到则用微软雅黑;
; 常用文件: msyh.ttc=微软雅黑, simsun.ttc=宋体, simhei.ttf=黑体,simkai.ttf=楷体, simfang.ttf=仿宋, simli.ttf=隶书, simyou.ttf=幼圆
FontFace=msyh.ttc
MaxLines=8			; 显示行数
BoardOpacity=30		; 底板不透明度 (0=彻底无底)
HoverMinOpacity=5	; 鼠标悬停战役框/触发条时最低透明度 0~100 (找区用, 默认5); 0=沿用渐隐
ExpandDelayMs=300	; 悬停停放多少毫秒后才展开显示历史 (默认300, 0=立即)
CampBottom=1		; 1=在底部显示(底边固定, 文本向上增长), 0=顶部显示
CampBottomMargin=150; 底部模式时距底边像素
CampCentered=1		; 1=水平居中, 0=左对齐(PosX)
PosX=2				; 左上角边距
PosY=2
TopGapLines=0		; 顶部预留行数
MaxWidth=550		; 框宽: 整数=像素, 0=自动(半屏); 0~1小数=按屏宽百分比(如0.5); 上限=屏宽-170
CampEnable=1		; 战役文本框总开关 (0=不显示战役/聊天/系统消息)
CampAnim=1			; 战役框打字机: 1=逐字出现(原版速率, 默认), 0=整行即时
CampBarSide=2		; 战役框滚动条: 0=不显示, 1=左侧, 2=右侧

ScrollStep=2	; 滚轮步长(行)，战役框历史, 鼠标滚轮在框内滚动; 滚动条悬停才显示

; ---- 聊天文本输入框 ----
ChatEdit=1		; 0=原版 (原生输入行照常显示), 1=自绘盒子 (原生行隐藏, 默认)
ChatBoxSP=1		; 单人模式也建聊天框 (0=原版单人无框)
ChatNameSP=0	; 单人消息是否显示 "名字: " 前缀 (0=只显示正文, 默认; 联机恒显示)
ImeFullscreen=-1	; 输入法候选窗定位基准: -1=自动(问 ddraw 包装层, 默认), 0=按窗口客户区(窗口化), 1=按显示器(上采样全屏)
; ---- 操作与战斗提示 (快捷键/路径点等操作提示 + 雷达事件) ----
HintShow=1
HintPosX=10				; 左边距
HintBottom=195			; 距底边像素
HintFontHeight=16		; 字高像素, 0=跟随游戏点阵字高
HintBold=0				; 粗体 (0=常规, 1=粗体)
HintFontFace=simsun.ttc	; 提示框字体
HintColorFollow=0	; 0=白字, 1=追随玩家实际颜色(原版色)
HintMaxLines=8		; 框里最多同时显示几行,多的靠滚轮翻
HintOpMaxLines=4	; 其中"操作提示"最多占几行, 剩下的行数留给雷达事件
HintMaxWidth=400	; 框宽像素, 0=自动
HintOpacity=0		; 底板不透明度 0~100 (0=不画底板, 文字阴影照画)
HintBarSide=2		; 滚动条: 0=不显示, 1=左侧, 2=右侧
HintTimeoutMul=2	; 操作提示显示时长倍率 (1=原版速度, 2=两倍, 上限10)
; ---- 雷达事件 (引擎 RadarEventType 0~16, 只收真能空格跳过去的那些) ----
HintRadarShow=1		; 1=把雷达事件写进操作与战斗提示
HintRadarClick=1	; 1=雷达事件行开头几个字可点击, 点一下视口跳到事件发生地 (悬停提亮)
HintRadarHold=900	; 战斗信息显示时长
; ---- 阴影设置 (战役框/提示框) ----
Shadow=1
ShadowDX=1
ShadowDY=1
ShadowSize=1		; 阴影粗细 (1=单层, 2~3加厚)
ShadowOpacity=100
; ---- 排查 ----
LogMessages=0	; 记录每条消息 (0=关闭, 1=开启, 含cs/to/sp)
ShowHotZone=0	; 历史触发条绿框 (1=显示, 0=隐藏; 隐藏后触发判定仍然有效)

; ---- 超武倒计时面板 ----
[SWPanel]
Enable=1			; 1=隐藏原版列表并重绘面板, 0=原版列表原样显示
Classic=1			; 1=原版式 (右对齐+逐行贴合黑条+行回引擎原位), 0=统一面板
FontPx=16			; 字高像素, 0=跟随游戏点阵字高
Bold=0				; 粗体 (0=常规, 1=粗体)
FontFace=simsun.ttc	; 字体文件名 (格式同战役框 FontFace)
Opacity=40			; 底板不透明度 0~100 (0=不画底板, 文字阴影照画)
RightMargin=0		; 面板右沿距屏右像素
BottomMargin=32		; 面板底沿距屏底像素
PadX=2				; 横向内边距像素 (左右)
PadY=0				; 纵向内边距像素 (上下, 经典行距=字高+2*PadY)
Gap=6				; 名列与计时器列间距像素
Shadow=1			; 1=画文字阴影
ShadowDX=1			; 阴影 X 偏移像素
ShadowDY=1			; 阴影 Y 偏移像素
ShadowSize=1		; 阴影粗细 (1=单层, 2~3加厚)
ShadowOpacity=100	; 阴影不透明度 0~100

; ---- 全局文本矢量接管 (简报/按钮等) ----
[VecText]
Enable=1			; 只管文本五钩; 0=走原版点阵, 缩放/底电等不受影响
FontFace=msyh.ttc	; 字体文件名
FontPx=18			; 全局字号: 0=自动校准(墨水对原版墨水, 版式最稳); >0 固定像素字号
Bold=0				; 粗体 (0=常规, 1=粗体)
MenuTake=1			; 菜单按钮整体替换 (禁用原字形, 全墨水自定义绘制, 不跟原版格子/裁剪)
DigitTrack=0		; 数字字距微调像素 (负=收紧, 正=放松, 只影响 0-9, 范围-8~8)
;资金设置
CreditPx=16			; 顶栏资源数字单独字号 (0=跟随全局; >0 覆盖, 只换墨水字宽不动
CreditDY=-1			; 顶栏数字垂直偏移 (像素, 负=上移, 正=下移)
;电力设置 (底部电量, 只画侧栏面; 字体/字号/粗体与上面资金同源)
PowerBottom=1		; 电力显示总开关: 1=开 (侧栏闪电+负载/电力), 0=关
PowerX=1			; 0=居中于侧边栏（默认）；>0=绝对x值，位于侧边栏空间内
PowerPad=32			; 屏幕底部到底端的距离，像素
PowerMode=1			; 0=负载/电力 (默认); 1=余量纯数字 (够用正数/不够负数)
TipBox=1			; 补丁，1=电力提示定制文本框，0=关
;简报设置
BriefOwn=1			; 1=简报正文自己排版重绘; 0=完全交回引擎原版
BriefLine=125		; 行距, 百分比。130=1.3, 0=跟原版格高;
BriefTrack=0		; 字距, 像素。加在字体前进宽之后 (标准 letter-spacing)
BriefWidth=580		; 正文盒宽, 像素, 折行按它。0=沿用引擎给的 453
BriefAdv=1			; 逐字格宽基准。1=字体自己的前进宽,0=统一 字号+字距
BriefMark=1			; 1=用深灰双线框标出文本边界 (外 2px + 内 1px); 0=不标
; ---- 排查 ----
Perf=0			; 1=每 2s 记字形命中/度量账 (VecText), 0=关闭
Render=1		; 1=矢量替换 (出厂默认 0, 验证通过再手开)

; ---- 单开关合集 ----
[Features]
ToolTips=1		; 建造提示三行 (1=三行: 耗时/耗电, 0=原版两行; 白底黑字)
WeaponRange=1	; 单位攻击范围 (1=单选一个单位且按住 Ctrl 时画当前武器射程圈: 蓝=最大/红=最小/青=对空, 0=关闭)
WeaponRangeAAZ=0; 对空圈高度 (0=贴地; 非0=抬高, leptons, 1格=256; 常用飞行高度500~650)
Observer=1		; 观战修复 (支持单机观战，支持显示AI面板，人类在前AI在后)
BuildQueue=1	; 建筑排队 (1=建筑可连点排队, 图标显示待建数, Shift+左键一次5个; 待放置时下一个先等着, 放下后自动开工; 0=原版行为)
AirWay=1		; 飞行器路径点 (1=允许飞机使用路径点, 返航摆头为原版行为; 0=原版行为)
;快捷键类修改
OrderThrottle=1	; 大量单位下令,解除128上限 (0=禁用, 与原版相同; 1=单机直写+联机原版(默认); 2=联机普通令也分帧,规划令仍原版)
WaypointCap=128	; 路径点上限,仅单机生效 (0=单机不限制; N>0=单机上限N, 最大4096; 联机走原版16/128)
TypeSelect=1	; T键建筑全选 (1=按T批量选中同类建筑, 原版仅 1x1 可展开建筑; 0=原版行为)
MindSelect=Shift+P	; 筛选心控单位: 结尾只剩心控单位 (0=禁用; 写快捷键=启用, 写法见 Hotkey.md)
AttackMove=X2		; 自定义移动攻击 (相当于原版 Ctrl+Shift+左键; 0=禁用; 写快捷键=启用, 写法见 Hotkey.md)
NoApproach=1	; 无法攻击目标的单位(如维修无人机)不再冲向该敌方目标 (1=停原地忽略该攻击令(默认); 0=原版行为)
SingleUnload=1	; 载员单卸 (1=左键点左下信息面板里的载员图标, 只让那一个下车(默认); 0=点图标不动作; 联机一律不启用)
PaxWaypoint=1	; 载员路径点 (1=按住 Z 点载员图标后, Z 不放时的地图左键给这个载员加点, 松手提交, 出舱后按路径走(默认); 0=不启用)
BeaconInSP=1	; 通信信标单机启用 (1=单机也能按 B 放信标, 每玩家仍是原版 3 个(默认); 0=原版只在联机可用)

; ---- 放建筑时驱离单位 ----
[PlaceScatter]
Mode=1		; 0=禁用(原版行为), 1=点下时驱离(默认, 晃幽影不碰单位), 2=幽影跟随自动驱离
Interval=30	; Mode=2 补扫间隔 (游戏逻辑帧, 5~300, 默认30)
Batch=16	; 每次触发最多发出的移动事件 (1~64, 默认16)
Dist=2		; 出框后再向外推的格数 (1~4, 默认2)

; ==== 建筑维修简化 ====
[RepairAll]
Mode=1		; 0禁用，1=双击维修 或 ctrl+维修，2=自动修
Interval=30	; Mode=2 的扫描间隔 (游戏逻辑帧, 5~600, 默认30≈1秒)。
Batch=24		; 每个逻辑帧最多入队多少条维修事件 (1~96, 默认24)。OutList 一帧上限 128,
DoubleClick=1	; 1=认双击/连按 (图标与快捷键都认), 0=只认 Ctrl+维修。
DblMs=400	; 两下的最大间隔 (毫秒, 100~1500, 默认400)。高帧率/不限速下帧数不可靠

; ==== 侵略模式 ====
[Aggressive]
Hotkey=Alt+A	; 切换选中单位的侵略标记; 已标记单位闲置时自动攻击警戒范围内的敌方建筑 (0=禁用; 语法见 Hotkey.md)
IconOffsetX=9	; 标记图标相对单位中心的横向像素偏移
IconOffsetY=-5	; 标记图标相对单位中心的纵向像素偏移 (负=上移)
Interval=30		; 空闲扫描间隔 (游戏逻辑帧, 1~300, 默认15≈0.5秒)
Cooldown=45		; 同一单位两次自动攻击的最小间隔
RangePercent=100; 攻击半径 = 单位警戒半径的百分比 (有GuardRange用原值, 否则用主/副武器射程较大者;10~400, 默认100)

; ==== 智能中键系列设置 ====
; 格式: [修饰键+]按键, 修饰键 Ctrl/Alt/Shift/Win 可多个, 大小写无所谓, 用 + 或空格分隔。
; 按键: 字母/数字/F1~F24/Space/Tab/Enter/Backspace/Insert/Delete/Home/End/PageUp/PageDown/
; Up/Down/Left/Right/Pause/Num0~Num9/ 鼠标 Middle/LMB/RMB/X1/X2。
; 多个按键时最后一个是主键, 前面的必须按住 (如 Ctrl+Z+Middle); None=禁用该功能。
; 快速建立巡逻圈
[PatrolCircle] 
Enable=1	; 1,点按建方环, 划线建外扩矩环, 0=关闭
Hotkey=Z+Middle	; 巡逻圈组合键 (最后一个是主键, 前面的必须按住)
Size=4		; 方环边长(格, 偶数, 默认4, 角=中心±Size/2; 划线外扩距离=Size/2)
Commit=1	; 1=布环后自动提交执行 (默认), 0=只布环不提交
NodeStep=2	; 拖线采样步长 (格, 切比雪夫距离, 1~8)
LoopClose=3	; 起终距离<此值判闭环走曲线 (格, 2~16; 远则矩环/点按)
LoopStep=3	; 曲线闭环路点最小间距 (格, 2~16; 越大越稀疏)
; ---- 兵营/战车工厂/船厂聚集点 (Z + 折线) ----
[RallyPath]
Enable=1		; 1=按住Z记多段折线, 出厂单位自动走折线, 0=原版单点
MaxNodes=15		; 单建筑最多尾巴段数 (2~16; 首段=玩家设的聚集点, 尾巴本机记录+出厂追单)
DelayFrames=30	; 出厂后等多少逻辑帧再下路径点
; 支持的建筑 ID (战车工厂 兵营 船厂 克隆缸);
Types=GAPILE,NAHAND,YABRCK,FABARR,GAWEAP,NAWEAP,YAWEAP,FAWEAP,GAYARD,NAYARD,YAYARD,FAYARD,NACLON

; ---- 中键智能下令移动 (点按自适应/划线散开) ----
[SmartOrder]
Enable=1		; 1=裸中键智能下令 (点按: 空地散开/敌人攻击/载具进入/建筑进驻, 划线: 散开), 0=关闭
Hotkey=Middle	; 智能下令触发键
NodeStep=2		; 拖线采样步长 (格, 切比雪夫距离, 1~8; 稀疏记录轨迹节点, 弧形槽位源)

; ---- 中键智能下令 (沿轨迹扫块挑目标, 按光标语义下单, 松开即执行) ----
[SmartArea]
Enable=1	; 1=组合中键区域自适应, 0=关闭
Hotkey=Shift+Middle	; 组合键触发 (Shift+中键; 也可改单键如 X1)
Range=3		; 扫描块边长 (格, 2~16, 默认4; 以轨迹各节点为中心由近及远挑目标; )
SquadSize=4	; 几打一 (1~16, 默认4; 同一目标最多几个单位下单, 满则分流下个目标, 与模糊同义; 进驻均分不管此项)

; ---- 快速砍树 ----
[TreeChop]
Enable=1	; 0=关闭
Hotkey=Ctrl+Z+Middle	; 砍树组合键
Range=6		; 扫描块边长 (格, 2~16, 默认4; 鼠标在块内 [Range/2][Range/2])

; ---- 模糊攻击 ----
[FuzzyAttack]
Enable=1	; 0=关闭
Hotkey=Ctrl+Middle	; 模糊攻击组合键
Range=4		; 扫描块边长 (格, 2~16, 默认4; 环扫由近及远)
SquadSize=4	; 几打一 (2~16, 默认4; 单位<=此数全员集火最近一个)

; ==== 建筑放置半透明预览 ====
[PlacementPreview]
Enable=1		; 0=关闭, 1=放置建筑时显示半透明预览 (检测到 Phobos.dll 时自动跳过)
Translucency=75	; 半透明级别 0/25/50/75 (默认 75);
; ---- 展开位置预览 ----
[DeployPreview]
Enable=1	;0=关闭 1=按住中键显示基地车或可展开建筑展开后占据格子预览, 
AutoDeploy=1	; 1=自动展开 0=只预览不对车下令
DeployTimeout=45	; 到位等待秒数 (5~300; 路被墙堵死超时放弃)
Ghost=1		; 1=展开位置显示半透明建筑虚影

; ==== 超武侧栏 ====
[SWSidebar]
Enable=1			; 总开关 0=关闭
ToggleKey=F4		; 切换显示/隐藏。隐藏时既不画也不占空间。语法见 Hotkey.md
Alpha=75			; 侧栏透明度 0~100。作用于侧栏画出的绝大多数
DedupDefensePage=1	; 原版"防御支援"页去重。1=侧栏已经显示的超武不再在原版页重复出现
Gap=1				; 同一列内上下两个图标之间的空隙 (像素)
ColGap=0			; 四列之间的水平空隙。0=紧贴, 侧栏更靠右更省地方
RightMargin=0		; 侧栏右缘到屏幕右缘的距离
MaxRows=10			; 每列最多显示几个。超出的不显示, 右侧出滚动条
FillMode=0			; 显示模式: 0=按阵营分列(默认) 1=填充式(排序不看阵营, 各列高度尽量均衡: 先两列,不够再依次加到三/四列,满四列才滚动)。显隐箭头上右键可实时切换
FontPx=16			; 充能百分比文字的字号
TopMargin=180		; 纵向位置，0 ~ 1比例, 0.5=垂直居中, 0.25=偏上。大于 1 = 像素
ScrollStep=1		; 滚轮每滚一格移动几行
Side=right			; 面板停靠边: right/left。盟军永远靠屏幕外缘,焚风永远靠地图内侧

; ---- 超武优先级 ----
; 负数 = 隐藏该超武;  0 或不写 = 默认显示 (优先级 1000)
; 正数 = 优先级, 数字越小越靠前。完整清单看超武列表.md
ForceShieldSpecial=1
IronCurtainSpecial=1

; ==== 侧栏功能 (拖动条 + 隐藏侧栏) ====
[Sidebar]
ScrollEnable=1		; 滚动条总开关 (默认 1)。0=完全不画也不吃点击
HitWidth=14			; 滚动条生效宽度 (像素, 6~20): 点击/拖动判定区
ShowWidth=6			; 滚动条显示宽度 (像素, 2~20): 滑块绘制宽, 右对齐在生效区内, 超过生效宽度则钳到生效宽度
RightMargin=3		; 滚动条离侧栏右缘的距离 (像素, 0~12)
ThumbColor=0xA5D3FF	; 滚动条滑块颜色
;隐藏侧栏
HideEnable=1	; 隐藏侧栏总开关 (默认 1)。1=启用隐藏侧栏/地图铺满。0=锁定完全显示 (底栏缩放照常用, F11 不切换)
Mode=0			; 隐藏侧栏初始态: 0=完全显示 / 1=只显示小地图和按钮 / 2=全屏
ExtraH=5		; 态1 在"资金条+小地图+两按钮"之外再多露几像素
ToggleKey=F11	; 隐藏侧栏三态切换热键 (写法见 Hotkey.md; None=禁用)
SkinSide=0		; 阵营 UI 皮肤: 0=跟随当前阵营(默认) / 1=盟军 / 2=苏联 / 3=厄普西隆 / 4=焚风。仅本地视觉, 联机不生效

; ==== 画中画 (第二摄像机小窗) ====
[PiP]
Enable=1		; 画中画总开关,1=侧栏出现开关按钮,小窗默认关,初始视野=打开时的主视图中心。
; 打开时落在右上角, 初始视野=打开时的主视图中心。三角感叹按钮:自动跟随最新雷达事件,鼠标:窗内左键操作。窗内右键按住可拖动小窗视野
AutoJump=0		; 自动跟随最新雷达事件 (三角按钮): 0=关 / 1=开; 开启立即跳到最新一条, 之后来新事件自动跟随
Operate=0		; 窗内左键操作 (鼠标按钮): 0=关 / 1=开; 开时小窗里左键可单击选中/下令、按住拖动框选, 右键仍是平移
Follow=1		; 小窗跟随 (F 键): 1=开 / 0=关; 小窗被点中时按 F 让小窗跟随当前选中单位, 主窗口不动。
; 与引擎自带跟随不同, 定下目标后换选择/取消选中/下别的令都不会断开; 只有再按 F、窗内右键拖动视野、
; 点小地图或点雷达事件 (要去看别处) 才取消。边框变琥珀色表示正在跟随
ButtonPos=8,155, 25,158, 0,160, 0,168	; 开关按钮位置, 依次为盟军/苏联/厄普西隆/焚风的 X,Y (X 相对侧栏列左缘, Y 相对屏幕顶边)
Width=288		; 小窗显示宽 (像素, 64~1024)
Height=192		; 小窗显示高 (像素, 48~1024)
Scale=2			; 离屏渲染倍率: 2=两倍分辨率再 2:1 降采样
Interval=2		; 每 N 帧刷一次第二摄像机 (1=每帧; 省性能可调大)
PadX=2			; 小窗在地图区内的右边距 (默认落在右上角)
PadY=2			; 小窗在地图区内的上边距
Border=1		; 画小窗边框 (1 像素): 1=画 / 0=不画
PanRate=8		; 窗内右键平移速度,每帧推进 = 距离 * 本值 / 6 屏幕像素; 越大越快
PanMax=6		; 窗内右键平移上限: 每帧最多 PanMax*PanRate 像素 (游戏上限 8 格约 240);


; ==== 底栏功能 ====
[BottomBar]
;缩放刻度条
ScaleEnable=1	; 缩放刻度条总开关 (默认 0)。1=底部工具栏上出现缩放刻度条
Level=4			; 起始档位。0=4倍 1=3倍 2=2倍 3=1.5倍 4=1x(默认) 5=视野1.25倍 6=视野1.5倍 7=视野2倍 8=max(最大或全图)
Len=250			; 刻度条长度 (像素, 80~2000)。
X=40			; 右侧边距,基准恒按侧栏存在算(= 窗口宽 - 168)
Y=1				; 下边距 = 控件底边到窗口底边多少像素
FontPx=12		; 档位文字字号 4x / 1x / 0.5x 常显
Void=0x202028	; 图外底色 (视口比整张地图还大时露出来的那一片), 0xRRGGBB。
LimitFallback=8192	; R长边上限像素 (默认8192)。0=无限制; 非0小于3820按3820;超限钳到限制,MAX档R最大最吃性能
; 暂停功能
PauseEnable=0	; 暂停/步进两按钮: 1=常显, 0=隐藏 (默认); 按一次暂停键后本局自动显示
PauseHotkey=F5	; 暂停/恢复 (仅单机遭遇战/战役有效, 联机不响应; F5 与联机嘲讽键复用, 单机无冲突)
; 网格显示功能
GridEnable=0		; 网格显示总开关: 0=关(默认), 1=开; ESC 菜单可切换并写回
GridCullBack=1		; 格网悬崖背面剔除: 1=背向镜头的崖面只留崖顶线, 0=全画 (透视线框)
GridShowBlocked=1	; 格网阻挡提示: 1=悬崖/城墙/矿/不可走/真断崖画红, 阻建造画叉/阻通行建造画叉加内框0=全灰
; 截图功能 截的是未缩放的视口原图不含任何UI
ShotEnable=0		; 截图键: 1=底栏刻度条左侧显示相机键, 0=隐藏(默认); 输出到 <游戏目录>\Screenshots


; ==== 左下角选中信息面板 ====
[UnitPanel]
Enable=1		; 总开关。1=左下角显示选中信息面板 / 0=完全不画(连点击也不吞)
Margin=0		; 整块离视口左边/下边的像素 (0=贴角; 不遮底栏, 与 FPS 显示重叠不管)
FontPx=11		; 血量/经验/弹药数字字号 (8~16)
FontFace=msyh.ttc	; 字体文件 (游戏目录或系统字体), 写文件名
Collapsed=0		; 初始是否折叠 (只留左下角那一个切换按钮)。1=折叠 / 0=展开
ActionLines=0	; 1=强制开启引擎单位行动线 (原版右键点击移动时那条线) / 0=不干预游戏内设置

; ==== 联机PVP作弊声明 ====
[PvpNotice]
Single=0	; 单人遭遇战测试,0=不发,1=与联机一致,2=只发一次;联机不受此项影响
; ==== ESC 菜单/设置页限帧 ==== ; ESC 菜单期间引擎没有帧率节流, 会空转吃满一个核; 开启后限到 60 帧
